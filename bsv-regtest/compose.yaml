# Generated by bsv-regtest/cmd/gen (2026-09-22T02:32:34Z) for 3 teranodes and 2 SV nodes. DO NOT EDIT; re-run: make gen N=3 SV=2
#
# Standalone BSV regtest network: teranodes, SV nodes with alert sidecars, arcade, merkle-service,
# wallet, alert hub. Works with docker compose and podman compose (make up). Networks:
#   chaosnet  10.190.0.0/24   node<->node p2p (9905), legacy/Bitcoin wire p2p to SV nodes (18444),
#                             kafka, datahub access for arcade/merkle
#   alertnet  192.0.0.128/26  alert-system p2p (teranode 9908, hub and sidecars 9906). A reserved
#                             subnet that libp2p classifies as public, so the alert library's
#                             private-IP gater and DHT filter pass.
#   ctlnet    10.191.0.0/24   control plane: RPC 9292 / 18332, asset 8090, propagation 8833,
#                             health 8000, alert APIs 3000
# Nothing here needs the internet at run time (no public bootstrap peers, no DHT); regenerate
# with INTERNAL=1 to make the networks egress-free as well.
#
# Usage:  make up                                  (or: docker|podman compose --profile ... up -d)
#         docker|podman compose exec tools alertctl probe --peer $TERANODE1_ALERT_ADDR

name: bsv-regtest

x-podman:
  in_pod: false

networks:
  chaosnet:
    name: bsv-regtest_chaosnet
    ipam:
      config:
        - subnet: 10.190.0.0/24
  alertnet:
    name: bsv-regtest_alertnet
    ipam:
      config:
        - subnet: 192.0.0.128/26
          gateway: 192.0.0.129
  ctlnet:
    name: bsv-regtest_ctlnet
    ipam:
      config:
        - subnet: 10.191.0.0/24

services:
  kafka-shared:
    image: ${REDPANDA_IMAGE:-docker.io/redpandadata/redpanda:v26.1.9}
    container_name: bsv-regtest-kafka-shared
    networks:
      chaosnet:
        ipv4_address: 10.190.0.5
    command:
      - redpanda start
      - --smp 1
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://kafka-shared:9092
      - --pandaproxy-addr 0.0.0.0:9093
      - --advertise-pandaproxy-addr localhost:9093
    mem_limit: ${REDPANDA_MEM_LIMIT:-512m}
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20

  alert-system:
    # go-alert-system node: the private alert network's bootstrap peer, DHT server and
    # canonical alert store (GET /alerts, /health). Built by: make build-alert-system
    image: ${ALERT_SYSTEM_IMAGE:-localhost/bsv-regtest/alert-system:v0.1.17}
    pull_policy: never
    container_name: bsv-regtest-alert-system
    # The image defaults to an unprivileged user, which cannot write a bind-mounted host
    # directory the runtime created (podman's ":U" chown flag fixes that, but docker compose
    # drops it silently, and podman-compose does not order an init container reliably). Run as
    # root in the container instead: under rootless podman that is your own user, under
    # docker the files are root-owned like every other service's data here.
    user: "0:0"
    networks:
      alertnet:
        ipv4_address: 192.0.0.130
      ctlnet:
        ipv4_address: 10.191.0.30
    environment:
      ALERT_SYSTEM_ENVIRONMENT: local
      ALERT_SYSTEM_CONFIG_FILEPATH: /config/config.json
    volumes:
      - ./config/alert-system/config.json:/config/config.json:ro,Z
      - ./.data/alert-system:/data:Z
    ports:
      - "${HUB_HOST_PORT:-3000}:3000"

  teranode1:
    image: ${TERANODE_IMAGE_1:-localhost/bsv-regtest/teranode:pr1764}
    container_name: bsv-regtest-teranode1
    networks:
      chaosnet:
        ipv4_address: 10.190.0.11
      alertnet:
        ipv4_address: 192.0.0.141
      ctlnet:
        ipv4_address: 10.191.0.11
    depends_on:
      kafka-shared:
        condition: service_healthy
    entrypoint: ["/app/wait.sh", "kafka-shared", "9092", "0", "--", "/app/teranode.run", "-localTestStartFromState=RUNNING"]
    env_file:
      - ./config/teranode/common.env
      - ./config/teranode/teranode1.env
    volumes:
      - ./.data/teranode1:/app/data:Z
    ports:
      - "21292:9292"    # rpc
      - "20090:8090"  # asset api + dashboard
      - "20000:8000" # health
      - "20833:8833"   # propagation http
    cap_add:
      - NET_ADMIN
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8000"]
      interval: 5s
      timeout: 3s
      retries: 60
    mem_limit: ${TERANODE_MEM_LIMIT:-3g}

  teranode2:
    image: ${TERANODE_IMAGE_2:-localhost/bsv-regtest/teranode:pr1764}
    container_name: bsv-regtest-teranode2
    networks:
      chaosnet:
        ipv4_address: 10.190.0.12
      alertnet:
        ipv4_address: 192.0.0.142
      ctlnet:
        ipv4_address: 10.191.0.12
    depends_on:
      kafka-shared:
        condition: service_healthy
    entrypoint: ["/app/wait.sh", "kafka-shared", "9092", "0", "--", "/app/teranode.run", "-localTestStartFromState=RUNNING"]
    env_file:
      - ./config/teranode/common.env
      - ./config/teranode/teranode2.env
    volumes:
      - ./.data/teranode2:/app/data:Z
    ports:
      - "23292:9292"    # rpc
      - "22090:8090"  # asset api + dashboard
      - "22000:8000" # health
      - "22833:8833"   # propagation http
    cap_add:
      - NET_ADMIN
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8000"]
      interval: 5s
      timeout: 3s
      retries: 60
    mem_limit: ${TERANODE_MEM_LIMIT:-3g}

  teranode3:
    image: ${TERANODE_IMAGE_3:-localhost/bsv-regtest/teranode:pr1764}
    container_name: bsv-regtest-teranode3
    networks:
      chaosnet:
        ipv4_address: 10.190.0.13
      alertnet:
        ipv4_address: 192.0.0.143
      ctlnet:
        ipv4_address: 10.191.0.13
    depends_on:
      kafka-shared:
        condition: service_healthy
    entrypoint: ["/app/wait.sh", "kafka-shared", "9092", "0", "--", "/app/teranode.run", "-localTestStartFromState=RUNNING"]
    env_file:
      - ./config/teranode/common.env
      - ./config/teranode/teranode3.env
    volumes:
      - ./.data/teranode3:/app/data:Z
    ports:
      - "25292:9292"    # rpc
      - "24090:8090"  # asset api + dashboard
      - "24000:8000" # health
      - "24833:8833"   # propagation http
    cap_add:
      - NET_ADMIN
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8000"]
      interval: 5s
      timeout: 3s
      retries: 60
    mem_limit: ${TERANODE_MEM_LIMIT:-3g}

  svnode1:
    # Bitcoin SV Node following the teranodes over the legacy (Bitcoin wire) protocol. It syncs
    # only over its outbound -connect links (SV Node never downloads blocks from inbound peers),
    # so bitcoin.conf lists every teranode's chaosnet IP:18444.
    image: ${SVNODE_IMAGE_1:-docker.io/bitcoinsv/bitcoin-sv:1.2.2}
    container_name: bsv-regtest-svnode1
    networks:
      chaosnet:
        ipv4_address: 10.190.0.21
      ctlnet:
        ipv4_address: 10.191.0.21
    # The image's entrypoint chowns /data and execs as user bitcoin; the conf lives outside
    # /data so it can be mounted read-only.
    command: ["bitcoind", "-conf=/config/bitcoin.conf"]
    volumes:
      - ./config/svnode/svnode1.conf:/config/bitcoin.conf:ro,Z
      - ./.data/svnode1:/data:Z
    ports:
      - "40332:18332"   # rpc
    healthcheck:
      test: ["CMD", "bitcoin-cli", "-conf=/config/bitcoin.conf", "getblockcount"]
      interval: 5s
      timeout: 5s
      retries: 60
    mem_limit: ${SVNODE_MEM_LIMIT:-2g}
    # bitcoind's Boost scheduler dies (pthread_cond_timedwait EINVAL) after a host suspend or
    # clock jump; nothing is lost, it just needs restarting.
    restart: on-failure

  alert-svnode1:
    # go-alert-system sidecar for svnode1: joins the private alert network like any other
    # node and applies every alert to its SV node over RPC (freeze -> addToConsensusBlacklist,
    # confiscate -> addToConfiscationTxidWhitelist, ban -> setban, invalidate -> invalidateblock).
    # Its /health (host 40300) reports the sequence and unprocessed_alerts (RPC failures).
    image: ${ALERT_SYSTEM_IMAGE:-localhost/bsv-regtest/alert-system:v0.1.17}
    pull_policy: never
    container_name: bsv-regtest-alert-svnode1
    user: "0:0"   # see alert-system
    networks:
      alertnet:
        ipv4_address: 192.0.0.151
      ctlnet:
        ipv4_address: 10.191.0.31
    depends_on:
      alert-system:
        condition: service_started
      svnode1:
        condition: service_started
    environment:
      ALERT_SYSTEM_ENVIRONMENT: local
      ALERT_SYSTEM_CONFIG_FILEPATH: /config/config.json
    volumes:
      - ./config/alert-system/svnode1.json:/config/config.json:ro,Z
      - ./.data/alert-svnode1:/data:Z
    ports:
      - "40300:3000"

  svnode2:
    # Bitcoin SV Node following the teranodes over the legacy (Bitcoin wire) protocol. It syncs
    # only over its outbound -connect links (SV Node never downloads blocks from inbound peers),
    # so bitcoin.conf lists every teranode's chaosnet IP:18444.
    image: ${SVNODE_IMAGE_2:-docker.io/bitcoinsv/bitcoin-sv:1.2.2}
    container_name: bsv-regtest-svnode2
    networks:
      chaosnet:
        ipv4_address: 10.190.0.22
      ctlnet:
        ipv4_address: 10.191.0.22
    # The image's entrypoint chowns /data and execs as user bitcoin; the conf lives outside
    # /data so it can be mounted read-only.
    command: ["bitcoind", "-conf=/config/bitcoin.conf"]
    volumes:
      - ./config/svnode/svnode2.conf:/config/bitcoin.conf:ro,Z
      - ./.data/svnode2:/data:Z
    ports:
      - "41332:18332"   # rpc
    healthcheck:
      test: ["CMD", "bitcoin-cli", "-conf=/config/bitcoin.conf", "getblockcount"]
      interval: 5s
      timeout: 5s
      retries: 60
    mem_limit: ${SVNODE_MEM_LIMIT:-2g}
    # bitcoind's Boost scheduler dies (pthread_cond_timedwait EINVAL) after a host suspend or
    # clock jump; nothing is lost, it just needs restarting.
    restart: on-failure

  alert-svnode2:
    # go-alert-system sidecar for svnode2: joins the private alert network like any other
    # node and applies every alert to its SV node over RPC (freeze -> addToConsensusBlacklist,
    # confiscate -> addToConfiscationTxidWhitelist, ban -> setban, invalidate -> invalidateblock).
    # Its /health (host 41300) reports the sequence and unprocessed_alerts (RPC failures).
    image: ${ALERT_SYSTEM_IMAGE:-localhost/bsv-regtest/alert-system:v0.1.17}
    pull_policy: never
    container_name: bsv-regtest-alert-svnode2
    user: "0:0"   # see alert-system
    networks:
      alertnet:
        ipv4_address: 192.0.0.152
      ctlnet:
        ipv4_address: 10.191.0.32
    depends_on:
      alert-system:
        condition: service_started
      svnode2:
        condition: service_started
    environment:
      ALERT_SYSTEM_ENVIRONMENT: local
      ALERT_SYSTEM_CONFIG_FILEPATH: /config/config.json
    volumes:
      - ./config/alert-system/svnode2.json:/config/config.json:ro,Z
      - ./.data/alert-svnode2:/data:Z
    ports:
      - "41300:3000"

  arcade:
    # ARC-compatible broadcaster (mode: all, pebble store, in-memory kafka). Profile: arcade.
    image: ${ARCADE_IMAGE:-ghcr.io/bsv-blockchain/arcade:latest}
    container_name: bsv-regtest-arcade
    profiles: ["arcade"]
    networks:
      chaosnet:
        ipv4_address: 10.190.0.40
      ctlnet:
        ipv4_address: 10.191.0.40
    command: ["--mode", "all", "--config", "/etc/arcade/config.yaml"]
    volumes:
      - ./config/arcade/config.yaml:/etc/arcade/config.yaml:ro,Z
      - ./.data/arcade:/data:Z
    ports:
      - "${ARCADE_HOST_PORT:-18080}:8080"
      - "${ARCADE_HEALTH_HOST_PORT:-18081}:8081"
      - "${ARCADE_SSE_HOST_PORT:-18082}:8082"         # GET /events (SSE)
      - "${ARCADE_CHAINTRACKS_HOST_PORT:-18083}:8083"  # /chaintracks/v2/*
    mem_limit: ${ARCADE_MEM_LIMIT:-1g}
    restart: on-failure

  merkle-service:
    # Merkle proof service: follows teranode blocks/subtrees over libp2p, serves callbacks
    # to arcade. sqlite + in-memory blobs; needs Kafka. Profile: merkle.
    image: ${MERKLE_IMAGE:-ghcr.io/bsv-blockchain/merkle-service@sha256:ff4ae409df2680c54267c27887dc1744fb3b64e5ddc5636882185ce82b35ced3}
    container_name: bsv-regtest-merkle-service
    profiles: ["merkle"]
    networks:
      chaosnet:
        ipv4_address: 10.190.0.41
      ctlnet:
        ipv4_address: 10.191.0.41
    depends_on:
      kafka-shared:
        condition: service_healthy
    env_file:
      - ./config/merkle-service.env
    volumes:
      - ./.data/merkle-service:/data:Z
    ports:
      - "${MERKLE_HOST_PORT:-18090}:8080"
    mem_limit: ${MERKLE_MEM_LIMIT:-1g}
    restart: on-failure

  wallet-db:
    # Postgres for wallet-infra: the published go-wallet-toolbox image is built without cgo,
    # so its sqlite driver is a stub. Profile: wallet.
    image: ${WALLET_DB_IMAGE:-docker.io/library/postgres:17-alpine}
    container_name: bsv-regtest-wallet-db
    profiles: ["wallet"]
    networks:
      chaosnet:
        ipv4_address: 10.190.0.43
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
      POSTGRES_DB: storage
    volumes:
      - ./.data/wallet-db:/var/lib/postgresql/data:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d storage"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: ${WALLET_DB_MEM_LIMIT:-256m}

  wallet-infra:
    # go-wallet-toolbox storage server (BRC-100 wallet infra) on postgres, network tstn pointed
    # at the local arcade. Profile: wallet.
    image: ${WALLET_IMAGE:-ghcr.io/bsv-blockchain/go-wallet-toolbox:v0.184.5}
    container_name: bsv-regtest-wallet-infra
    profiles: ["wallet"]
    networks:
      chaosnet:
        ipv4_address: 10.190.0.42
      ctlnet:
        ipv4_address: 10.191.0.42
    depends_on:
      wallet-db:
        condition: service_healthy
    environment:
      TSTN_ARCADE_URL: http://10.190.0.40:8080
      TSTN_CHAINTRACKS_URL: http://10.190.0.40:8083/chaintracks
    volumes:
      - ./config/wallet-infra/infra-config.yaml:/app/infra-config.yaml:ro,Z
    ports:
      - "${WALLET_HOST_PORT:-18100}:8100"
    mem_limit: ${WALLET_MEM_LIMIT:-512m}
    restart: on-failure

  walletd:
    # A small HTTP wallet (go-wallet-toolbox BRC-100 client) holding the dev wallet identity
    # from keys.json; it talks to wallet-infra (a storage server, not a wallet server) over
    # BRC-103 mutual auth. Broadcasting is wallet-infra's job (configured to post to arcade).
    # Its own image because it is its own Go module (see walletd/Dockerfile). Profile: wallet.
    image: ${WALLETD_IMAGE:-localhost/bsv-regtest/walletd:local}
    pull_policy: never
    container_name: bsv-regtest-walletd
    profiles: ["wallet"]
    networks:
      chaosnet:
        ipv4_address: 10.190.0.52
      ctlnet:
        ipv4_address: 10.191.0.52
    depends_on:
      wallet-infra:
        condition: service_started
    environment:
      WALLET_INFRA_URL: http://10.191.0.42:8100
      BSV_NETWORK: tstn
      LISTEN: ":8700"
    volumes:
      - ./config:/config:ro,Z
    ports:
      - "${WALLETD_HOST_PORT:-18700}:8700"
    mem_limit: ${WALLETD_MEM_LIMIT:-256m}
    restart: on-failure

  tools:
    # alertctl + stackctl on the alert and control networks. Profile: tools.
    image: ${TOOLS_IMAGE:-localhost/bsv-regtest/tools:local}
    pull_policy: never
    container_name: bsv-regtest-tools
    profiles: ["tools"]
    networks:
      alertnet:
        ipv4_address: 192.0.0.180
      ctlnet:
        ipv4_address: 10.191.0.50
    env_file:
      - ./config/tools.env
    volumes:
      - ./config:/config:ro,Z
      - ./.data/tools:/data:Z

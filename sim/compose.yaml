# Simulator layer: attaches to a running bsv-regtest network (../bsv-regtest) via its networks and inventory.
#   make sim-build && make sim-up     →  http://localhost:8600
# Chaos actions (partitions, pause, stop) and container logs go through the engine's API socket,
# bind-mounted at /var/run/docker.sock. CONTAINER_SOCKET is its path on the host:
#   docker: nothing to set (/var/run/docker.sock; rootless docker: make sim-up reads DOCKER_HOST)
#   podman: make sim-up resolves it from `podman info`. Without make, set it yourself:
#           CONTAINER_SOCKET=$(podman info --format '{{.Host.RemoteSocket.Path}}') podman compose up -d
#           (the socket exists once: systemctl --user enable --now podman.socket)
x-podman:
  in_pod: false

networks:
  chaosnet:
    external: true
    name: bsv-regtest_chaosnet
  alertnet:
    external: true
    name: bsv-regtest_alertnet
  ctlnet:
    external: true
    name: bsv-regtest_ctlnet

services:
  orchestrator:
    image: ${ORCHESTRATOR_IMAGE:-localhost/chaos-orchestrator:local}
    build:
      context: ..
      dockerfile: sim/Dockerfile
    container_name: chaos-orchestrator
    networks:
      chaosnet:
        ipv4_address: 10.190.0.51
      alertnet:
        ipv4_address: 192.0.0.181
      ctlnet:
        ipv4_address: 10.191.0.51
    environment:
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka-shared:9092}
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - ../bsv-regtest/config:/config:ro,Z
      - ${SCENARIOS_DIR:-../examples/scenarios}:/scenarios:ro,Z
      - ./.data:/data:Z
      - ${CONTAINER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    security_opt:
      - label=disable
    ports:
      - "${SIM_HOST_PORT:-8600}:8600"
    restart: unless-stopped
